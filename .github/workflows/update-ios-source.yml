name: Update iOS source
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: voryn-ios-source
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test source validation
        run: python3 -m unittest discover -s tests -p 'test_ios_source.py'
      - name: Fetch and verify both apps
        run: python3 tools/update_ios_source.py
      - name: Publish updated catalog
        id: publish
        run: |
          if git diff --quiet -- docs/source.json; then
            echo 'Both apps are already current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/source.json
          git commit -m 'chore(source): refresh Voryn Labs iOS apps'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
